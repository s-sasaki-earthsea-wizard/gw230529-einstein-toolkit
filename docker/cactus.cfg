# Einstein Toolkit build options (for the Docker environment)
# =================================================================
# Inherited unchanged from the GW150914 project's cactus.cfg.
# Only -O2 is used, with no -march flag, so an image built locally stays
# portable to cloud CPUs (AMD Genoa and similar).
# Follows the upstream jupyter-et tutorial.cfg, adjusted for this project.
# Verified against the Kruskal release (ET_2025_05).
#
# Update the VERSION string whenever the build options here change:
# SimFactory reconfigures and rebuilds the application when VERSION changes.

VERSION = 2026-04-23

# ---- Compilers ----
CPP = cpp
CC  = gcc
CXX = g++
FPP = cpp
F90 = gfortran

# ---- Preprocessor flags ----
CPPFLAGS =
FPPFLAGS = -traditional

# ---- Language flags ----
CFLAGS   = -g -std=gnu99
CXXFLAGS = -g -std=gnu++17
F90FLAGS = -g -fcray-pointer -ffixed-line-length-none

# ---- Linker ----
LDFLAGS = -rdynamic

# ---- Debugging and optimisation ----
DEBUG              = no
CPP_DEBUG_FLAGS    =
C_DEBUG_FLAGS      =
CXX_DEBUG_FLAGS    =

OPTIMISE           = yes
CPP_OPTIMISE_FLAGS =
C_OPTIMISE_FLAGS   = -O2
CXX_OPTIMISE_FLAGS = -O2
F90_OPTIMISE_FLAGS = -O2

PROFILE            = no
CPP_PROFILE_FLAGS  =
C_PROFILE_FLAGS    = -pg
CXX_PROFILE_FLAGS  = -pg
F90_PROFILE_FLAGS  = -pg

WARN               = yes
CPP_WARN_FLAGS     = -Wall
C_WARN_FLAGS       = -Wall
CXX_WARN_FLAGS     = -Wall
F90_WARN_FLAGS     = -Wall

# ---- OpenMP (thread parallelism) ----
OPENMP           = yes
CPP_OPENMP_FLAGS = -fopenmp
FPP_OPENMP_FLAGS = -D_OPENMP
C_OPENMP_FLAGS   = -fopenmp
CXX_OPENMP_FLAGS = -fopenmp
F90_OPENMP_FLAGS = -fopenmp

# ---- Vectorisation ----
VECTORISE                = yes
VECTORISE_ALIGNED_ARRAYS = no
VECTORISE_INLINE         = yes

# ---- Extra libraries (installed under /usr/local by the Dockerfile) ----
PTHREADS_DIR = NO_BUILD

ADIOS2_DIR      = /usr/local
ADIOS2_INC_DIRS = /usr/local/include
ADIOS2_LIB_DIRS = /usr/local/lib
ADIOS2_LIBS     = adios2_cxx11_mpi adios2_c_mpi adios2_core_mpi adios2_cxx11 adios2_c adios2_core

NSIMD_SIMD = SSE2
